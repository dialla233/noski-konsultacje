name: Noski cancellation verification
on:
  push:
    branches: [codex/paid-booking-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test apps/web/app/api/noski/bookings/verify-google-cancellation.test.mjs
