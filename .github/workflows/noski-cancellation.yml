name: Noski cancellation verification
on:
  push:
    branches: [codex/paid-booking-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: cancellation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test apps/web/app/api/noski/bookings/verify-google-cancellation.test.mjs
      - name: Verify actual operation migrations and cancellation states
        env:
          PGPASSWORD: test_only
        run: psql -h localhost -U postgres -d cancellation_test -v ON_ERROR_STOP=1 -f scripts/check-noski-operation-states.sql
